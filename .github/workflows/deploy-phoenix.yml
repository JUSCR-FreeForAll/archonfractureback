name: Build & Deploy Phoenix Monitor

on:
  push:
    branches: [main]
    paths:
      - "monitor/**"
      - ".github/workflows/deploy-phoenix.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/phoenix-monitor

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: monitor/pnpm-lock.yaml

      - name: Install and typecheck
        working-directory: ./monitor
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./monitor
          file: ./monitor/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Configure VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_PORT and GHCR_READ_TOKEN.
      # GHCR_READ_TOKEN should be a narrowly-scoped read:packages token.
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: GITHUB_REPOSITORY,GITHUB_ACTOR,GHCR_READ_TOKEN
          script: |
            set -eu
            cd /opt/phoenix
            export GITHUB_REPOSITORY_LOWER="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
            printf '%s' "$GHCR_READ_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            docker compose pull phoenix-monitor
            docker compose up -d --remove-orphans phoenix-monitor
            docker logout ghcr.io
            docker image prune -f
        env:
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
