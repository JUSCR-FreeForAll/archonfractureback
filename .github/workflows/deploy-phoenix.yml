name: Lost Legacies Live - CI/CD Pipeline

on:
  push:
    branches: [codex/six-segment-interoperability, main]
    paths:
      - "monitor/**"
      - "src/**"
      - "prisma/**"
      - "scripts/**"
      - "db/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "eslint.config.*"
      - ".github/workflows/deploy-phoenix.yml"
  pull_request:
    branches: [codex/six-segment-interoperability, main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/phoenix-monitor

jobs:
  validate-and-test:
    name: Lint, Typecheck, Prisma & Test Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: eternal_vault_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eternal_vault_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (Node 22)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      # The checked-in root package-lock.json predates the Prisma dependencies
      # currently declared in package.json. npm install reconciles that lock
      # during this run; commit a regenerated lockfile to restore npm ci.
      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Prisma Client
        env:
          DATABASE_URL: postgresql://postgres:password123@localhost:5432/eternal_vault_test?schema=public
        run: npm run db:generate

      - name: Run TypeScript & Prisma Verification
        env:
          DATABASE_URL: postgresql://postgres:password123@localhost:5432/eternal_vault_test?schema=public
        run: bash scripts/verify-ts-prisma.sh

      - name: Run ESLint & Code Linting
        run: npm run lint

      - name: Run Unified Test Suite
        env:
          DATABASE_URL: postgresql://postgres:password123@localhost:5432/eternal_vault_test?schema=public
          NODE_ENV: test
        run: bash scripts/run-all-tests.sh

  build-and-deploy:
    name: Build & Deploy Phoenix Monitor
    needs: validate-and-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: monitor/pnpm-lock.yaml

      - name: Install and typecheck
        working-directory: ./monitor
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./monitor
          file: ./monitor/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: GITHUB_REPOSITORY,GITHUB_ACTOR,GHCR_READ_TOKEN
          script: |
            set -eu
            cd /opt/phoenix
            export GITHUB_REPOSITORY_LOWER="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
            printf '%s' "$GHCR_READ_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            docker compose pull phoenix-monitor
            docker compose up -d --remove-orphans phoenix-monitor
            docker logout ghcr.io
            docker image prune -f
        env:
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
